<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Command Center</title>

<!-- ✅ LOGO ICON -->
<link rel="icon" type="image/png" href="image-removebg-preview.png">
<link rel="apple-touch-icon" href="image-removebg-preview.png">

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #050816;
  }

  /* 🔥 SPLASH SCREEN */
  #splash {
    position: fixed;
    width: 100%;
    height: 100vh;
    background: radial-gradient(circle, #0a0f1c, #050816);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
    animation: fadeOut 1s ease 3s forwards;
  }

  #splash img {
    width: 130px;
    animation: zoomIn 1.5s ease;
    filter: drop-shadow(0 0 15px #00aaff);
  }

  #splash h1 {
    margin-top: 15px;
    font-size: 20px;
    letter-spacing: 2px;
    color: #ffffffcc;
  }

  @keyframes zoomIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
  }

  /* 📊 MAIN CONTENT */
  #main {
    display: none;
    height: 100vh;
    width: 100%;
  }

  iframe {
    width: 100%;
    height: 100vh;
    border: none;
  }
</style>
</head>

<body>

<!-- 🔥 OPENING ANIMATION -->
<div id="splash">
  <img src="image-removebg-preview.png" alt="Seal Logo">
  <h1>COMMAND CENTER</h1>
</div>

<!-- 📊 YOUR ORIGINAL IFRAME (AUTO-FIT) -->
<div id="main">
  <iframe 
    src="https://docs.google.com/spreadsheets/d/1vRT7kJ8zE_22pkeN-4RG0dxCXYWxiLp_XFlz2wczwQY/htmlembed?gid=0&single=true&widget=true&headers=false"
    frameborder="0">
  </iframe>
</div>

<script>
  // ⏱ Show iframe after splash
  setTimeout(() => {
    document.getElementById("main").style.display = "block";
  }, 3000);
</script>

</body>
</html>

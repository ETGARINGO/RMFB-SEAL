<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full View Spreadsheet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #f8f9fa;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Minimal Header for Logo */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        header img {
            height: 45px;
            width: auto;
        }

        /* Full Height Iframe */
        .content {
            flex-grow: 1;
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <img src="1 LOGO 3D (1).png" alt="Logo">
        </header>
        <div class="content">
            <iframe src="https://docs.google.com/spreadsheets/d/1DChX2lwMfE5t5gSPku5aRB66KiP1rcKSo2WSAmUi0p0/edit?rm=minimal"></iframe>
        </div>
    </div>

</body>
</html>

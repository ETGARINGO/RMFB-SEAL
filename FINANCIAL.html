<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Regional Mobile Force Battalion 9</title>

<link rel="icon" type="image/png" href="image-removebg-preview.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: #050816;
    overflow: hidden;
    color: white;
  }

  /* ⚡ LIGHTNING */
  body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(0,150,255,0.2), transparent);
    animation: lightningFlash 5s infinite;
    pointer-events: none;
  }

  @keyframes lightningFlash {
    0%, 95%, 100% { opacity: 0; }
    96% { opacity: 1; }
    98% { opacity: 0.5; }
  }

  /* 🔥 SPLASH */
  #splash {
    position: fixed;
    width: 100%;
    height: 100vh;
    background: radial-gradient(circle, #0a0f1c, #050816);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    animation: fadeOut 1s ease 3.5s forwards;
  }

  #splash img {
    width: 140px;
    animation: zoomGlow 2s ease;
    filter: drop-shadow(0 0 15px #00aaff);
  }

  #splash h1 {
    margin-top: 15px;
    letter-spacing: 3px;
    font-size: 22px;
    opacity: 0.8;
  }

  @keyframes zoomGlow {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
  }

  /* 📊 MAIN */
  #main {
    display: none;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ✅ HEADER BAR (VISIBLE ALWAYS) */
  .top-header {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    padding: 10px;
    text-align: center;
    font-size: 14px;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(0,150,255,0.3);
  }

  /* 📱 IFRAME */
  iframe {
    flex: 1;
    width: 100%;
    border: none;
  }

</style>
</head>

<body>

<!-- 🔥 SPLASH -->
<div id="splash">
  <img src="image-removebg-preview.png">
  <h1>Regional Mobile Force Battalion 9</h1>
</div>

<!-- 📊 MAIN -->
<div id="main">

  <!-- ✅ CUSTOM HEADER DISPLAY -->
  <div class="top-header">
    Timestamp | Unit | Station | Rank | Full Name | Badge No | Memberships
  </div>

  <!-- ✅ IFRAME WITH HEADERS ENABLED -->
  <iframe 
    src="https://docs.google.com/spreadsheets/d/1vRT7kJ8zE_22pkeN-4RG0dxCXYWxiLp_XFlz2wczwQY/htmlembed?gid=0&single=true&widget=true&headers=true">
  </iframe>

</div>

<script>
  setTimeout(() => {
    document.getElementById("main").style.display = "flex";
  }, 3500);

  setInterval(() => {
    document.body.style.filter = "brightness(1.4)";
    setTimeout(() => {
      document.body.style.filter = "brightness(1)";
    }, 100);
  }, 6000);
</script>

</body>
</html>

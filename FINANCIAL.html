<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Command Center</title>

  <!-- ✅ FAVICON -->
  <link rel="icon" type="image/png" href="image-removebg-preview.png">
  <link rel="apple-touch-icon" href="image-removebg-preview.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0f1c;
      color: white;
    }

    /* 🔥 Splash Screen */
    #splash {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: #0a0f1c;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      animation: fadeOut 1s ease 3s forwards;
    }

    #splash img {
      width: 120px;
      animation: zoomIn 1.5s ease;
    }

    #splash h1 {
      margin-top: 15px;
      font-size: 20px;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    @keyframes zoomIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    /* 📊 Main Content */
    #main {
      display: none;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>

<body>

<!-- 🔥 SPLASH SCREEN -->
<div id="splash">
  <img src="image-removebg-preview.png" alt="Logo">
  <h1>COMMAND CENTER</h1>
</div>

<!-- 📊 MAIN CONTENT -->
<div id="main">
  <iframe 
    src="https://docs.google.com/spreadsheets/d/1vRT7kJ8zE_22pkeN-4RG0dxCXYWxiLp_XFlz2wczwQY/htmlembed?gid=0&single=true&widget=true&headers=false">
  </iframe>
</div>

<script>
  // ⏱ Show main content after splash
  setTimeout(() => {
    document.getElementById("main").style.display = "block";
  }, 3000);
</script>

</body>
</html>

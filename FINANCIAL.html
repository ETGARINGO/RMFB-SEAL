<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Command Center</title>

<link rel="icon" href="image-removebg-preview.png">

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #050816;
  }

  /* ⚡ Lightning Effect */
  body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(0,150,255,0.25), transparent);
    animation: lightning 6s infinite;
    pointer-events: none;
  }

  @keyframes lightning {
    0%, 96%, 100% { opacity: 0; }
    97% { opacity: 1; }
    98% { opacity: 0.3; }
    99% { opacity: 1; }
  }

  /* 📊 Auto-fit iframe */
  iframe {
    width: 100%;
    height: 100vh;
    border: none;
  }
</style>
</head>

<body>

<iframe 
  src="https://docs.google.com/spreadsheets/d/1vRT7kJ8zE_22pkeN-4RG0dxCXYWxiLp_XFlz2wczwQY/htmlembed?gid=0&single=true&widget=true&headers=false">
</iframe>

<script>
  // ⚡ Random flash boost
  setInterval(() => {
    document.body.style.filter = "brightness(1.5)";
    setTimeout(() => {
      document.body.style.filter = "brightness(1)";
    }, 120);
  }, 7000);
</script>

</body>
</html>

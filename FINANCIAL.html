<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Regional Mobile Force Battalion 9</title>

<link rel="icon" type="image/png" href="image-removebg-preview.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: #050816;
    overflow: hidden;
    color: white;
  }

  /* 🔝 HEADER GRID ALIGNMENT */
  .top-header {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1.5fr 0.8fr 2fr 1fr 2fr;
    background: #000;
    color: #fff;
    font-size: 12px;
    text-align: center;
    padding: 8px 0;
    border-bottom: 2px solid #00aaff;
  }

  .top-header div {
    border-right: 1px solid rgba(255,255,255,0.2);
  }

  .top-header div:last-child {
    border-right: none;
  }

  /* 📊 MAIN */
  #main {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  iframe {
    flex: 1;
    width: 100%;
    border: none;
  }

</style>
</head>

<body>

<div id="main">

  <!-- ✅ ALIGNED HEADER -->
  <div class="top-header">
    <div>Timestamp</div>
    <div>Unit</div>
    <div>Rank</div>
    <div>Full Name</div>
    <div>Badge No</div>
    <div>Memberships</div>
  </div>

  <!-- ✅ EMBED -->
  <iframe 
    src="https://docs.google.com/spreadsheets/d/1vRT7kJ8zE_22pkeN-4RG0dxCXYWxiLp_XFlz2wczwQY/htmlembed?gid=0&single=true&widget=true&headers=false">
  </iframe>

</div>

</body>
</html>
